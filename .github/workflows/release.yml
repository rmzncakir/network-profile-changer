name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    # Optional secrets — the signing and VirusTotal steps stay dormant until these
    # are set in the repo, so the workflow keeps working before they're configured.
    #   SIGNPATH_API_TOKEN    → SignPath user token (code signing)
    #   VIRUSTOTAL_API_KEY    → free VirusTotal API key (malware scan links)
    # And repo *variables* (Settings → Secrets and variables → Actions → Variables):
    #   SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          "version=$ver" >> $env:GITHUB_OUTPUT

      # The "## [<version>]" section of CHANGELOG.md becomes the release notes.
      # Fails fast (before building) if the changelog has no entry for this tag.
      - name: Extract changelog section
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $section = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line.StartsWith('## ')) { $inside = $line.StartsWith("## [$env:VERSION]"); continue }
            if ($line -match '^\[[^\]]+\]: https?://') { break }
            if ($inside) { $section += $line }
          }
          $changes = ($section -join "`n").Trim()
          if (-not $changes) { throw "CHANGELOG.md has no '## [$env:VERSION]' section." }
          $delim = "CHANGELOG_$([guid]::NewGuid().ToString('N'))"
          "changes<<$delim", $changes, $delim | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test NetworkProfileManager.Tests/NetworkProfileManager.Tests.csproj --configuration Release --logger "console;verbosity=minimal"

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish NetworkProfileManager/NetworkProfileManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:PublishReadyToRun=false
          -o publish

      - name: Clean publish artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path publish -Filter "*.pdb" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      # ── Code signing (SignPath) ─────────────────────────────────────────────
      # Dormant until SIGNPATH_API_TOKEN + the three SIGNPATH_* repo variables are
      # set. Once active it signs NetworkProfileManager.exe in place (before zip),
      # which clears both the SmartScreen and UAC "Unknown publisher" warnings.
      # Setup: apply for a free SignPath Foundation OSS certificate, then create a
      # project + signing policy and fill in the org id / project slug / policy slug.
      - name: Upload unsigned build for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-publish
          path: publish

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      - name: Zip release
        shell: pwsh
        run: |
          $zipName = "NetworkProfileManager-v${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zipName -Force
          "Created $zipName ($((Get-Item $zipName).Length / 1MB) MB)"

      - name: Generate SHA256 checksum
        id: sum
        shell: pwsh
        run: |
          $zip  = Get-ChildItem "NetworkProfileManager-v*-win-x64.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          "$hash  $($zip.Name)" | Out-File "$($zip.Name).sha256" -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Wrote $($zip.Name).sha256 = $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NetworkProfileManager-v*-win-x64.zip
            NetworkProfileManager-v*-win-x64.zip.sha256
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ steps.notes.outputs.changes }}

            ## Download

            1. Download **NetworkProfileManager-v${{ steps.ver.outputs.version }}-win-x64.zip**.
            2. Extract anywhere (e.g. `C:\Tools\NetworkProfileManager\`).
            3. Double-click `NetworkProfileManager.exe`. Windows asks for administrator permission (UAC) when you apply a change — `netsh` requires it.

            > If Windows SmartScreen shows an "Unknown publisher" warning → **More info → Run anyway.**

            ## Verify the download
            SHA256 of the zip:
            ```
            ${{ steps.sum.outputs.sha256 }}
            ```
            Check it on your machine:
            ```powershell
            Get-FileHash .\NetworkProfileManager-v${{ steps.ver.outputs.version }}-win-x64.zip -Algorithm SHA256
            ```

            ## Updating
            No auto-updater — to upgrade, download the new zip and extract it over the previous folder. Your profiles live in `%LOCALAPPDATA%\NetworkProfileManager\data\` and survive updates.

      # ── Malware scan links (VirusTotal) ─────────────────────────────────────
      # Dormant until VIRUSTOTAL_API_KEY is set. Uploads the artifacts to VirusTotal
      # and appends the scan links to the release notes — a free trust signal.
      - name: VirusTotal scan
        if: env.VIRUSTOTAL_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            NetworkProfileManager-v*-win-x64.zip
